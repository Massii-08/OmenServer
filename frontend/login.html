<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmenServer — Connexion</title>
    <meta name="description" content="Panel de gestion de serveur dédié polyvalent">
    <script>try{if(localStorage.getItem('omen-mode')==='light'){document.documentElement.setAttribute('data-mode','light');var _m=document.querySelector('meta[name="theme-color"]');if(_m)_m.setAttribute('content','#EBF0FA')}}catch(e){}</script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <link rel="stylesheet" href="/css/style.css?v=123">
    <!-- Fallback dark style : visible dans Claude Desktop preview / file:// direct (qui ne résolvent pas /css/style.css absolu).
         Override total par style.css quand servi par le backend FastAPI. -->
    <meta name="color-scheme" content="dark">
    <style>
        :root { color-scheme: dark; }
        html, body { background: #050810; color: #EDF2FA; font-family: 'Geist', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; margin: 0; }
        h1, h2, h3, h4, p, span, td, th, li, label, a { color: #EDF2FA; }
        button, input, select, textarea { background: #131C33; color: #EDF2FA; border: 1px solid #1C2947; border-radius: 8px; padding: 6px 12px; font: inherit; }
        button:hover { background: #1C2947; }
        .hint, .text-muted, ::placeholder { color: #8FA3C4; }
        .mono, code { font-family: ui-monospace, SFMono-Regular, 'Geist Mono', monospace; font-feature-settings: "tnum"; }
    </style>
    <script src="/js/lang.js"></script>
</head>
<body>
    <div class="login-page">
        <div class="login-card fade-in">
            <button class="mode-btn" id="mode-toggle" aria-pressed="false" title="">
                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75 A6.25 6.25 0 0 1 8 14.25 Z" fill="currentColor"/></svg>
            </button>
            <!-- Brand (Bento — same as topbar pattern) -->
            <div class="login-brand" id="login-brand">
                <div class="login-logo">O</div>
                <div class="login-brand-text" id="login-title">OMENSERVER</div>
            </div>

            <!-- Segmented language pill (FR/EN/IT) -->
            <div style="display:flex;justify-content:center;margin-bottom:20px;">
                <div class="lang-switcher" id="login-lang-switcher">
                    <button class="lang" data-lang="fr" onclick="LoginPage.setLang('fr')">FR</button>
                    <button class="lang" data-lang="en" onclick="LoginPage.setLang('en')">EN</button>
                    <button class="lang" data-lang="it" onclick="LoginPage.setLang('it')">IT</button>
                </div>
            </div>

            <!-- Wizard steps (visible seulement en mode setup) -->
            <div id="wizard-steps" class="wizard-steps hidden">
                <div class="wizard-step active" id="wizard-dot-1"></div>
                <div class="wizard-step" id="wizard-dot-2"></div>
                <div class="wizard-step" id="wizard-dot-3"></div>
            </div>

            <!-- Message d'erreur -->
            <div id="login-error" class="login-error"></div>

            <!-- Étape 1 du Wizard : Nom du serveur -->
            <div id="wizard-step-1" class="hidden">
                <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 8px; text-align: center;">
                    Bienvenue
                </h2>
                <p style="font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 20px;">
                    Première configuration de ton serveur
                </p>
                <div class="form-group">
                    <label class="form-label">Nom de ton serveur</label>
                    <input type="text" class="form-input" id="setup-server-name" 
                           placeholder="Mon OmenServer" value="OmenServer">
                </div>
                <button class="btn btn-primary login-btn" onclick="LoginPage.wizardNext(1)">
                    Suivant →
                </button>
            </div>

            <!-- Étape 2 du Wizard : Créer le compte admin -->
            <div id="wizard-step-2" class="hidden">
                <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 8px; text-align: center;">
                    Crée ton compte admin
                </h2>
                <p style="font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 20px;">
                    Ce sera le compte principal de ton serveur
                </p>
                <div class="form-group">
                    <label class="form-label">Nom d'utilisateur</label>
                    <input type="text" class="form-input" id="setup-username" placeholder="admin">
                </div>
                <div class="form-group">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" class="form-input" id="setup-password" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label class="form-label">Confirmer le mot de passe</label>
                    <input type="password" class="form-input" id="setup-password-confirm" placeholder="••••••••">
                </div>
                <button class="btn btn-primary login-btn" onclick="LoginPage.wizardNext(2)">
                    Créer le compte →
                </button>
            </div>

            <!-- Formulaire de login (affiché si le setup est déjà fait) -->
            <div id="login-form">
                <div class="form-group">
                    <label class="form-label">Nom d'utilisateur</label>
                    <input type="text" class="form-input" id="login-username" placeholder="admin">
                </div>
                <div class="form-group">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" class="form-input" id="login-password" placeholder="••••••••"
                           onkeydown="if(event.key==='Enter') LoginPage.login()">
                </div>
                <button class="btn btn-primary login-btn" onclick="LoginPage.login()">
                    Se connecter
                </button>
                <div style="text-align:center;margin-top:12px;">
                    <span style="font-size:12px;color:var(--text-muted);">Tu as un code d'invitation ?</span>
                    <a href="#" onclick="LoginPage.showJoinForm();return false" style="font-size:12px;color:var(--accent);text-decoration:none;margin-left:4px;">Créer un compte →</a>
                </div>
            </div>

            <!-- Formulaire d'inscription par invitation -->
            <div id="join-form" class="hidden">
                <h2 style="font-size:18px;font-weight:700;margin-bottom:4px;text-align:center;">Rejoindre OmenServer</h2>
                <p id="join-role-info" style="font-size:12px;color:var(--text-muted);text-align:center;margin-bottom:16px;"></p>
                <div class="form-group">
                    <label class="form-label">Code d'invitation</label>
                    <input type="text" class="form-input" id="join-code" placeholder="aB3kXz9m" style="font-family:monospace;letter-spacing:2px;text-align:center;font-size:16px;">
                </div>
                <div class="form-group">
                    <label class="form-label">Nom d'utilisateur</label>
                    <input type="text" class="form-input" id="join-username" placeholder="Ton pseudo">
                </div>
                <div class="form-group">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" class="form-input" id="join-password" placeholder="••••••••"
                           onkeydown="if(event.key==='Enter') LoginPage.joinWithInvite()">
                </div>
                <button class="btn btn-primary login-btn" onclick="LoginPage.joinWithInvite()">
                    Créer mon compte
                </button>
                <div style="text-align:center;margin-top:12px;">
                    <a href="#" onclick="LoginPage.showLoginForm();return false" style="font-size:12px;color:var(--text-muted);text-decoration:none;">← Retour à la connexion</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        const LoginPage = {
            serverName: 'OmenServer',

            async init() {
                // Si déjà connecté, aller au dashboard
                if (Auth.isLoggedIn()) {
                    window.location.href = '/';
                    return;
                }

                // Appliquer la langue
                this.applyLang();

                // Vérifier si c'est la première config
                const needsSetup = await Auth.checkSetupNeeded();
                if (needsSetup) {
                    this.showWizard();
                    return;
                }

                // Détecter un code d'invitation dans l'URL (?invite=CODE)
                const params = new URLSearchParams(window.location.search);
                const inviteCode = params.get('invite');
                if (inviteCode) {
                    this.showJoinForm();
                    document.getElementById('join-code').value = inviteCode;
                    // Vérifier le code automatiquement
                    this._checkInviteCode(inviteCode);
                }
            },

            showWizard() {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('join-form')?.classList.add('hidden');
                document.getElementById('wizard-steps').classList.remove('hidden');
                document.getElementById('wizard-step-1').classList.remove('hidden');
                document.getElementById('login-title').textContent = 'Configuration';
            },

            showJoinForm() {
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('join-form').classList.remove('hidden');
                document.getElementById('login-title').textContent = 'Inscription';
                document.getElementById('login-error').classList.remove('show');
            },

            showLoginForm() {
                document.getElementById('join-form').classList.add('hidden');
                document.getElementById('login-form').classList.remove('hidden');
                document.getElementById('login-title').textContent = 'OmenServer';
                document.getElementById('login-error').classList.remove('show');
            },

            async _checkInviteCode(code) {
                try {
                    const r = await fetch(`/api/auth/invite-info/${code}`);
                    const info = document.getElementById('join-role-info');
                    if (r.ok) {
                        const data = await r.json();
                        if (info) info.textContent = `Invitation valide — Rôle : ${data.role_name}`;
                        if (info) info.style.color = 'var(--accent)';
                    } else {
                        const err = await r.json().catch(() => ({}));
                        if (info) info.textContent = `${err.detail || 'Code invalide'}`;
                        if (info) info.style.color = 'var(--danger)';
                    }
                } catch (e) { /* silencieux */ }
            },

            async joinWithInvite() {
                const errorEl = document.getElementById('login-error');
                errorEl.classList.remove('show');

                const code = document.getElementById('join-code').value.trim();
                const username = document.getElementById('join-username').value.trim();
                const password = document.getElementById('join-password').value;

                if (!code) { errorEl.textContent = Lang.t('login.invite_enter'); errorEl.classList.add('show'); return; }
                if (!username) { errorEl.textContent = Lang.t('login.choose_username'); errorEl.classList.add('show'); return; }
                if (password.length < 8) { errorEl.textContent = Lang.t('login.password_min'); errorEl.classList.add('show'); return; }

                try {
                    const r = await fetch(`/api/auth/join/${code}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password }),
                    });

                    if (r.ok) {
                        const data = await r.json();
                        localStorage.setItem('omen_token', data.access_token);
                        window.location.href = '/';
                    } else {
                        const err = await r.json().catch(() => ({}));
                        errorEl.textContent = err.detail || Lang.t('login.signup_error');
                        errorEl.classList.add('show');
                    }
                } catch (e) {
                    errorEl.textContent = Lang.t('login.server_error');
                    errorEl.classList.add('show');
                }
            },

            async wizardNext(step) {
                const errorEl = document.getElementById('login-error');
                errorEl.classList.remove('show');

                if (step === 1) {
                    this.serverName = document.getElementById('setup-server-name').value.trim() || 'OmenServer';
                    // Passer à l'étape 2
                    document.getElementById('wizard-step-1').classList.add('hidden');
                    document.getElementById('wizard-step-2').classList.remove('hidden');
                    document.getElementById('wizard-dot-1').classList.remove('active');
                    document.getElementById('wizard-dot-1').classList.add('done');
                    document.getElementById('wizard-dot-2').classList.add('active');
                }

                if (step === 2) {
                    const username = document.getElementById('setup-username').value.trim();
                    const password = document.getElementById('setup-password').value;
                    const passwordConfirm = document.getElementById('setup-password-confirm').value;

                    if (!username) {
                        errorEl.textContent = Lang.t('login.enter_username');
                        errorEl.classList.add('show');
                        return;
                    }
                    if (password.length < 8) {
                        errorEl.textContent = Lang.t('login.password_min');
                        errorEl.classList.add('show');
                        return;
                    }
                    if (password !== passwordConfirm) {
                        errorEl.textContent = Lang.t('login.passwords_mismatch');
                        errorEl.classList.add('show');
                        return;
                    }

                    const result = await Auth.register(username, password, this.serverName);
                    if (result.success) {
                        window.location.href = '/';
                    } else {
                        errorEl.textContent = result.error;
                        errorEl.classList.add('show');
                    }
                }
            },

            async login() {
                const errorEl = document.getElementById('login-error');
                errorEl.classList.remove('show');

                const username = document.getElementById('login-username').value.trim();
                const password = document.getElementById('login-password').value;

                if (!username || !password) {
                    errorEl.textContent = Lang.t('login.fill_all');
                    errorEl.classList.add('show');
                    return;
                }

                const result = await Auth.login(username, password);
                if (result.success) {
                    window.location.href = '/';
                } else {
                    errorEl.textContent = result.error;
                    errorEl.classList.add('show');
                }
            },

            setLang(lang) {
                Lang.set(lang);
                this.applyLang();
            },

            toggleLang() {
                // Backward-compat — cycles FR → EN → IT → FR
                const order = ['fr', 'en', 'it'];
                const next = order[(order.indexOf(Lang.current) + 1) % order.length];
                Lang.set(next);
                this.applyLang();
            },

            applyLang() {
                const t = (k) => Lang.t(k);
                // Segmented lang pill — toggle .active on FR/EN/IT
                document.querySelectorAll('#login-lang-switcher .lang').forEach(b => {
                    b.classList.toggle('active', b.dataset.lang === Lang.current);
                });

                // Login form labels
                const labels = document.querySelectorAll('#login-form .form-label');
                if (labels[0]) labels[0].textContent = t('login.username');
                if (labels[1]) labels[1].textContent = t('login.password');
                const loginBtn = document.querySelector('#login-form .login-btn');
                if (loginBtn) loginBtn.textContent = t('login.submit');
                // Invite link
                const inviteSpan = document.querySelector('#login-form div[style*="text-align:center"] span');
                if (inviteSpan) inviteSpan.textContent = t('login.invite_question');
                const inviteLink = document.querySelector('#login-form div[style*="text-align:center"] a');
                if (inviteLink) inviteLink.textContent = t('login.create_account');

                // Join form
                const joinTitle = document.querySelector('#join-form h2');
                if (joinTitle) joinTitle.textContent = t('login.join_title');
                const joinLabels = document.querySelectorAll('#join-form .form-label');
                if (joinLabels[0]) joinLabels[0].textContent = t('login.invite_code');
                if (joinLabels[1]) joinLabels[1].textContent = t('login.username');
                if (joinLabels[2]) joinLabels[2].textContent = t('login.password');
                const joinBtn = document.querySelector('#join-form .login-btn');
                if (joinBtn) joinBtn.textContent = t('login.create_my_account');
                const backLink = document.querySelector('#join-form a');
                if (backLink) backLink.textContent = t('login.back');

                // Wizard
                const wizH2_1 = document.querySelector('#wizard-step-1 h2');
                if (wizH2_1) wizH2_1.textContent = t('login.setup_welcome');
                const wizP_1 = document.querySelector('#wizard-step-1 p');
                if (wizP_1) wizP_1.textContent = t('login.setup_subtitle');
                const wizLabel_1 = document.querySelector('#wizard-step-1 .form-label');
                if (wizLabel_1) wizLabel_1.textContent = t('login.setup_servername');
                const wizBtn_1 = document.querySelector('#wizard-step-1 .login-btn');
                if (wizBtn_1) wizBtn_1.textContent = t('login.setup_next');

                const wizH2_2 = document.querySelector('#wizard-step-2 h2');
                if (wizH2_2) wizH2_2.textContent = t('login.setup_create_admin');
                const wizP_2 = document.querySelector('#wizard-step-2 p');
                if (wizP_2) wizP_2.textContent = t('login.setup_admin_subtitle');
                const wizLabels_2 = document.querySelectorAll('#wizard-step-2 .form-label');
                if (wizLabels_2[0]) wizLabels_2[0].textContent = t('login.username');
                if (wizLabels_2[1]) wizLabels_2[1].textContent = t('login.password');
                if (wizLabels_2[2]) wizLabels_2[2].textContent = t('login.setup_confirm_password');
                const wizBtn_2 = document.querySelector('#wizard-step-2 .login-btn');
                if (wizBtn_2) wizBtn_2.textContent = t('login.setup_create');
            },
        };

        // Toggle clair/sombre (standalone — pas d'app.js sur cette page)
        (function () {
            var btn = document.getElementById('mode-toggle');
            if (!btn) return;
            function refresh() {
                var light = document.documentElement.getAttribute('data-mode') === 'light';
                btn.setAttribute('aria-pressed', String(light));
                btn.title = (typeof Lang !== 'undefined' && Lang.t) ? Lang.t('common.theme_toggle') : 'Clair / sombre';
            }
            btn.addEventListener('click', function () {
                var light = document.documentElement.getAttribute('data-mode') === 'light';
                if (light) {
                    document.documentElement.removeAttribute('data-mode');
                    localStorage.removeItem('omen-mode');
                } else {
                    document.documentElement.setAttribute('data-mode', 'light');
                    localStorage.setItem('omen-mode', 'light');
                }
                refresh();
            });
            refresh();
        })();

        // Initialiser au chargement
        document.addEventListener('DOMContentLoaded', () => LoginPage.init());
    </script>
</body>
</html>
