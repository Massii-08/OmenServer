<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmenServer — Dashboard</title>

    <meta name="description" content="Panel de gestion de serveur dédié polyvalent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f0f1a">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/icon-512.svg">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/style.css?v=106">
</head>
<body>
    <div class="app-layout">
        <!-- TOP BAR (PR26 — replaces sidebar per MASTER §6 mockup) -->
        <nav class="topbar">
            <div class="brand">
                <div class="logo">O</div>
                <span>OMENSERVER</span>
            </div>
            <div class="nav-tabs" id="nav-tabs">
                <button class="nav-tab nav-item active" data-view="hub" onclick="App.navigateTo('hub')">Dashboard</button>
                <button class="nav-tab nav-item" data-view="game_server" onclick="App.navigateTo('game_server')" id="nav-game_server">Serveurs</button>
                <button class="nav-tab nav-item" data-view="bots" onclick="App.navigateTo('bots')" id="nav-bots">Bots</button>
                <button class="nav-tab nav-item" data-view="files" onclick="App.navigateTo('files')" id="nav-files">Fichiers</button>
                <button class="nav-tab nav-item" data-view="media" onclick="App.navigateTo('media')" id="nav-media">Média</button>
                <button class="nav-tab nav-item" data-view="web" onclick="App.navigateTo('web')" id="nav-web">Web</button>
                <button class="nav-tab nav-item" data-view="network" onclick="App.navigateTo('network')" id="nav-network">Réseau</button>
                <button class="nav-tab nav-item" data-view="sysdoc" onclick="App.navigateTo('sysdoc')" id="nav-sysdoc">Diagnostic</button>
            </div>
            <div class="topbar-right">
                <div class="lang-switcher" id="lang-switcher">
                    <button class="lang" data-lang="fr" onclick="Lang.set('fr')">FR</button>
                    <button class="lang" data-lang="en" onclick="Lang.set('en')">EN</button>
                    <button class="lang active" data-lang="it" onclick="Lang.set('it')">IT</button>
                </div>
                <div class="accent-switcher-mini" id="accent-switcher" title="Couleur d'accent">
                    <span class="accent-dot" data-acc="green" title="Vert"></span>
                    <span class="accent-dot" data-acc="blue" title="Bleu"></span>
                    <span class="accent-dot" data-acc="red" title="Rouge"></span>
                    <span class="accent-dot" data-acc="yellow" title="Jaune"></span>
                </div>
                <div class="user-menu-wrap" id="user-menu-wrap">
                    <button class="user-pill" id="user-pill-btn" onclick="App._toggleUserMenu(event)" aria-haspopup="menu" aria-expanded="false">
                        <div class="user-avatar" id="user-avatar">?</div>
                        <div class="user-meta">
                            <div class="user-name" id="user-name">—</div>
                            <div class="user-role" id="user-role">—</div>
                        </div>
                        <span class="user-caret" aria-hidden="true">▾</span>
                    </button>
                    <div class="user-menu" id="user-menu" role="menu" hidden>
                        <button class="user-menu-item" role="menuitem" onclick="App._userMenuGo('users')" id="user-menu-users" hidden>Utilisateurs</button>
                        <button class="user-menu-item" role="menuitem" onclick="App._userMenuGo('settings')" id="user-menu-settings">Paramètres</button>
                        <div class="user-menu-sep" aria-hidden="true"></div>
                        <button class="user-menu-item danger" role="menuitem" onclick="App._userMenuLogout()" id="user-menu-logout">Se déconnecter</button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- CONTENU PRINCIPAL -->
        <main class="main-content" id="module-content">
            <!-- Le contenu est injecté dynamiquement par App.js -->
            <div class="text-center" style="padding: 60px; color: var(--text-muted);">
                Chargement...
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="/js/lang.js?v=115"></script>
    <script src="/js/toast.js?v=87"></script>
    <script src="/js/auth.js?v=87"></script>
    <script src="/js/monitoring.js?v=92"></script>
    <script src="/js/modules.js?v=84"></script>
    <script src="/js/game_server.js?v=97"></script>
    <script src="/js/sv_settings.js?v=89"></script>
    <script src="/js/sv_players.js?v=88"></script>
    <script src="/js/sv_access.js?v=96"></script>
    <script src="/js/sv_files.js?v=89"></script>
    <script src="/js/sv_monitoring.js?v=88"></script>
    <script src="/js/sv_history.js?v=88"></script>
    <script src="/js/server_view.js?v=99"></script>
    <script src="/js/files_module.js?v=88"></script>
    <script src="/js/bots_module.js?v=102"></script>
    <script src="/js/media_module.js?v=89"></script>
    <script src="/js/web_module.js?v=89"></script>
    <script src="/js/network_module.js?v=92"></script>
    <script src="/js/sysdoc_module.js?v=8"></script>
    <script src="/js/app.js?v=118"></script>
    <script>
        // Enregistrement du Service Worker (PWA)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('[PWA] Service Worker enregistré:', reg.scope))
                .catch(err => console.warn('[PWA] Erreur SW:', err));
        }
    </script>
</body>
</html>
