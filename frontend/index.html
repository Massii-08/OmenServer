<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmenServer — Dashboard</title>

    <meta name="description" content="Panel de gestion de serveur dédié polyvalent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050810">
    <script>try{if(localStorage.getItem('omen-mode')==='light'){document.documentElement.setAttribute('data-mode','light');var _m=document.querySelector('meta[name="theme-color"]');if(_m)_m.setAttribute('content','#EBF0FA')}}catch(e){}</script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
    <link rel="apple-touch-icon" href="/icon-512.svg?v=2">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/style.css?v=123">
    <!-- Fallback dark style : visible dans Claude Desktop preview / file:// direct (qui ne résolvent pas /css/style.css absolu).
         Override total par style.css quand servi par le backend FastAPI. Voir CLAUDE.md / vault concept page. -->
    <meta name="color-scheme" content="dark">
    <style>
        :root { color-scheme: dark; }
        html, body { background: #050810; color: #EDF2FA; font-family: 'Geist', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; margin: 0; }
        h1, h2, h3, h4, p, span, td, th, li, label, a { color: #EDF2FA; }
        button, input, select, textarea { background: #131C33; color: #EDF2FA; border: 1px solid #1C2947; border-radius: 8px; padding: 6px 12px; font: inherit; }
        button:hover { background: #1C2947; }
        .hint, .text-muted, .section-sub, .brand-sub, ::placeholder { color: #8FA3C4; }
        .mono, code, pre { font-family: ui-monospace, SFMono-Regular, 'Geist Mono', monospace; font-feature-settings: "tnum"; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border-bottom: 1px solid #1C2947; padding: 8px 12px; text-align: left; }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- TOP BAR (PR26 — replaces sidebar per MASTER §6 mockup) -->
        <nav class="topbar">
            <div class="brand">
                <div class="logo">O</div>
                <span>OMENSERVER</span>
            </div>
            <div class="nav-tabs" id="nav-tabs">
                <button class="nav-tab nav-item active" data-view="hub" onclick="App.navigateTo('hub')">Dashboard</button>
                <button class="nav-tab nav-item" data-view="game_server" onclick="App.navigateTo('game_server')" id="nav-game_server">Serveurs</button>
                <button class="nav-tab nav-item" data-view="bots" onclick="App.navigateTo('bots')" id="nav-bots">Bots</button>
                <button class="nav-tab nav-item" data-view="files" onclick="App.navigateTo('files')" id="nav-files">Fichiers</button>
                <button class="nav-tab nav-item" data-view="media" onclick="App.navigateTo('media')" id="nav-media">Média</button>
                <button class="nav-tab nav-item" data-view="web" onclick="App.navigateTo('web')" id="nav-web">Web</button>
                <button class="nav-tab nav-item" data-view="network" onclick="App.navigateTo('network')" id="nav-network">Réseau</button>
            </div>
            <div class="topbar-right">
                <div class="lang-switcher" id="lang-switcher">
                    <button class="lang" data-lang="fr" onclick="Lang.set('fr')">FR</button>
                    <button class="lang" data-lang="en" onclick="Lang.set('en')">EN</button>
                    <button class="lang active" data-lang="it" onclick="Lang.set('it')">IT</button>
                </div>
                <div class="accent-switcher-mini" id="accent-switcher" title="Couleur d'accent">
                    <span class="accent-dot" data-acc="green" title="Vert"></span>
                    <span class="accent-dot" data-acc="cyan" title="Cyan"></span>
                    <span class="accent-dot" data-acc="violet" title="Violet"></span>
                    <span class="accent-dot" data-acc="magenta" title="Magenta"></span>
                    <span class="accent-dot" data-acc="amber" title="Ambre"></span>
                </div>
                <button class="mode-btn" id="mode-toggle" onclick="App.toggleMode()" aria-pressed="false" title="">
                    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75 A6.25 6.25 0 0 1 8 14.25 Z" fill="currentColor"/></svg>
                </button>
                <div class="user-menu-wrap" id="user-menu-wrap">
                    <button class="user-pill" id="user-pill-btn" onclick="App._toggleUserMenu(event)" aria-haspopup="menu" aria-expanded="false">
                        <div class="user-avatar" id="user-avatar">?</div>
                        <div class="user-meta">
                            <div class="user-name" id="user-name">—</div>
                            <div class="user-role" id="user-role">—</div>
                        </div>
                        <span class="user-caret" aria-hidden="true">▾</span>
                    </button>
                    <div class="user-menu" id="user-menu" role="menu" hidden>
                        <button class="user-menu-item" role="menuitem" onclick="App._userMenuGo('sysdoc')" id="user-menu-sysdoc">Diagnostic</button>
                        <button class="user-menu-item" role="menuitem" onclick="App._userMenuGo('users')" id="user-menu-users" hidden>Utilisateurs</button>
                        <button class="user-menu-item" role="menuitem" onclick="App._userMenuGo('settings')" id="user-menu-settings">Paramètres</button>
                        <div class="user-menu-sep" aria-hidden="true"></div>
                        <button class="user-menu-item danger" role="menuitem" onclick="App._userMenuLogout()" id="user-menu-logout">Se déconnecter</button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- CONTENU PRINCIPAL -->
        <main class="main-content" id="module-content">
            <!-- Le contenu est injecté dynamiquement par App.js -->
            <div class="text-center" style="padding: 60px; color: var(--text-muted);">
                Chargement...
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="/js/lang.js?v=263"></script>
    <script src="/js/anim.js?v=4"></script>
    <script src="/js/toast.js?v=88"></script>
    <script src="/js/auth.js?v=87"></script>
    <script src="/js/monitoring.js?v=96"></script>
    <script src="/js/modules.js?v=84"></script>
    <script src="/js/game_server.js?v=99"></script>
    <script src="/js/sv_settings.js?v=90"></script>
    <script src="/js/sv_players.js?v=90"></script>
    <script src="/js/sv_access.js?v=98"></script>
    <script src="/js/sv_files.js?v=90"></script>
    <script src="/js/sv_monitoring.js?v=89"></script>
    <script src="/js/sv_history.js?v=90"></script>
    <script src="/js/server_view.js?v=102"></script>
    <script src="/js/files_module.js?v=89"></script>
    <script src="/js/bots_module.js?v=237"></script>
    <script src="/js/harvester_module.js?v=12"></script>
    <script src="/js/oracle_module.js?v=17"></script>
    <script src="/js/market_module.js?v=7"></script>
    <script src="/js/media_module.js?v=90"></script>
    <script src="/js/web_module.js?v=91"></script>
    <script src="/js/network_module.js?v=94"></script>
    <script src="/js/sysdoc_module.js?v=13"></script>
    <script src="/js/app.js?v=222"></script>
    <script>
        // Enregistrement du Service Worker (PWA)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('[PWA] Service Worker enregistré:', reg.scope))
                .catch(err => console.warn('[PWA] Erreur SW:', err));
        }
    </script>
</body>
</html>
