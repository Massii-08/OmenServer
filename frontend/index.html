<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmenServer — Dashboard</title>

    <meta name="description" content="Panel de gestion de serveur dédié polyvalent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f0f1a">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/icon-512.svg">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/style.css?v=67">
</head>
<body>
    <div class="app-layout">
        <!-- Mobile hamburger -->
        <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open');document.getElementById('sidebar-overlay').classList.toggle('active')">☰</button>
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="document.getElementById('sidebar').classList.remove('open');this.classList.remove('active')"></div>
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <!-- Header -->
            <div class="sidebar-header">
                <div class="sidebar-logo">🖥️</div>
                <div>
                    <div class="sidebar-title">OmenServer</div>
                    <div class="sidebar-subtitle" id="sidebar-subtitle">Panel de gestion</div>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="sidebar-nav">
                <div class="nav-section-label">Général</div>
                <a class="nav-item active" data-view="hub" onclick="App.navigateTo('hub')">
                    <span class="nav-item-icon">📊</span> Dashboard
                </a>

                <div class="nav-section-label">Modules</div>
                <a class="nav-item" data-view="game_server" onclick="App.navigateTo('game_server')" id="nav-game_server">
                    <span class="nav-item-icon">🎮</span> Serveurs de jeux
                </a>
                <a class="nav-item" data-view="bots" onclick="App.navigateTo('bots')" id="nav-bots">
                    <span class="nav-item-icon">🤖</span> Bots
                </a>
                <a class="nav-item" data-view="files" onclick="App.navigateTo('files')" id="nav-files">
                    <span class="nav-item-icon">📁</span> Fichiers
                </a>
                <a class="nav-item" data-view="media" onclick="App.navigateTo('media')" id="nav-media">
                    <span class="nav-item-icon">📺</span> Média
                </a>
                <a class="nav-item" data-view="web" onclick="App.navigateTo('web')" id="nav-web">
                    <span class="nav-item-icon">🌐</span> Web
                </a>
                <a class="nav-item" data-view="network" onclick="App.navigateTo('network')" id="nav-network">
                    <span class="nav-item-icon">📡</span> Réseau
                </a>

                <div class="nav-section-label">Système</div>
                <a class="nav-item" data-view="users" onclick="App.navigateTo('users')" id="nav-users" style="display:none;">
                    <span class="nav-item-icon">👥</span> Utilisateurs
                </a>
                <a class="nav-item" data-view="settings" onclick="App.navigateTo('settings')">
                    <span class="nav-item-icon">⚙️</span> Paramètres
                </a>
            </nav>

            <!-- Footer : infos utilisateur -->
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="user-avatar">?</div>
                    <div style="flex:1;">
                        <div class="user-name" id="user-name">—</div>
                        <div class="user-role" id="user-role">—</div>
                    </div>
                    <button onclick="Lang.toggle()" title="FR/EN" style="background:none;border:none;cursor:pointer;font-size:16px;padding:4px;" id="lang-btn">🌐</button>
                    <button onclick="App.cycleTheme()" title="Changer de thème" style="background:none;border:none;cursor:pointer;font-size:18px;padding:4px;" id="theme-btn">🎨</button>
                    <button onclick="App.toggleLightMode()" title="Mode clair/sombre" style="background:none;border:none;cursor:pointer;font-size:18px;padding:4px;" id="lightmode-btn">🌗</button>
                </div>
            </div>
        </aside>

        <!-- CONTENU PRINCIPAL -->
        <main class="main-content" id="module-content">
            <!-- Le contenu est injecté dynamiquement par App.js -->
            <div class="text-center" style="padding: 60px; color: var(--text-muted);">
                Chargement...
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="/js/lang.js?v=100"></script>
    <script src="/js/toast.js?v=84"></script>
    <script src="/js/auth.js?v=84"></script>
    <script src="/js/monitoring.js?v=88"></script>
    <script src="/js/modules.js?v=84"></script>
    <script src="/js/game_server.js?v=88"></script>
    <script src="/js/sv_settings.js?v=84"></script>
    <script src="/js/sv_players.js?v=84"></script>
    <script src="/js/sv_access.js?v=92"></script>
    <script src="/js/sv_files.js?v=84"></script>
    <script src="/js/sv_monitoring.js?v=84"></script>
    <script src="/js/sv_history.js?v=84"></script>
    <script src="/js/server_view.js?v=90"></script>
    <script src="/js/files_module.js?v=84"></script>
    <script src="/js/bots_module.js?v=95"></script>
    <script src="/js/media_module.js?v=84"></script>
    <script src="/js/web_module.js?v=85"></script>
    <script src="/js/network_module.js?v=86"></script>
    <script src="/js/app.js?v=101"></script>
    <script>
        // Enregistrement du Service Worker (PWA)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('[PWA] Service Worker enregistré:', reg.scope))
                .catch(err => console.warn('[PWA] Erreur SW:', err));
        }
    </script>
</body>
</html>
